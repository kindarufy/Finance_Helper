name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: finance_db
          POSTGRES_USER: finance_user
          POSTGRES_PASSWORD: finance_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: finance_helper/source_files

    env:
      BOT_TOKEN: 123456:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi
      INTERNAL_API_KEY: ci-internal-api-key
      MINIAPP_SIGNING_SECRET: ci-miniapp-signing-secret
      MINIAPP_PUBLIC_URL: https://example.test/miniapp/app
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: finance_db
      POSTGRES_USER: finance_user
      POSTGRES_PASSWORD: finance_pass
      FINANCE_URL: http://127.0.0.1:8001
      ANALYTICS_URL: http://127.0.0.1:8002
      GATEWAY_URL: http://127.0.0.1:8000
      UPLOAD_DIR: /tmp/finance-helper-uploads
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: finance_helper/source_files/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile sources
        run: python -m compileall -q services tests scripts

      - name: Run tests
        run: python -m pytest -q

      - name: Verify local demo and repeatable seed
        run: |
          python scripts/run_demo.py --smoke-test
          python scripts/run_demo.py --smoke-test
